<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 320 300" role="img" aria-label="Scan me - Nunta Elena și Alexandru">
  <!-- Card -->
  <rect x="6" y="6" width="308" height="288" rx="28" fill="#ffffff" stroke="#ececec" stroke-width="2"/>

  <!-- Tag frame with downward tail -->
  <path d="M114,44 H206 Q220,44 220,58 V150 Q220,164 206,164 H180 L160,186 L140,164 H114 Q100,164 100,150 V58 Q100,44 114,44 Z"
        fill="#ffffff" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>

  <!-- QR code -->
  <image x="112" y="56" width="96" height="96" preserveAspectRatio="xMidYMid meet"
         href="data:image/png;base64,"/>

  <!-- Globe icon -->
  <g transform="translate(82,211) scale(0.85)" fill="none" stroke="#111111" stroke-width="2.4">
    <circle cx="10" cy="10" r="10"/>
    <ellipse cx="10" cy="10" rx="4.2" ry="10"/>
    <line x1="0" y1="10" x2="20" y2="10"/>
    <line x1="2" y1="4" x2="18" y2="4"/>
    <line x1="2" y1="16" x2="18" y2="16"/>
  </g>

  <!-- Text -->
  <text x="172" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#111111" stroke="#111111" stroke-width="0.5">SCANEAZĂ-MĂ</text>
</svg>
