<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Elena si Alexandru - verighete nunta">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CBAE7A"/>
      <stop offset="1" stop-color="#A98A59"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#gold)"/>

  <!-- Wedding rings -->
  <g fill="none" stroke="#ffffff" stroke-width="4">
    <circle cx="26" cy="38" r="13"/>
    <circle cx="40" cy="38" r="13"/>
  </g>

  <!-- Diamond sparkle on the right ring -->
  <g transform="translate(40,20)">
    <path d="M0,-6 L4,0 L0,6 L-4,0 Z" fill="#ffffff"/>
    <path d="M0,-6 L4,0 L0,0 Z" fill="#f0e6cf"/>
  </g>
</svg>
